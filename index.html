
<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Digital Board Studio 2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#edf2f7;color:#152238}.app{display:grid;grid-template-columns:430px 1fr;height:100vh}.panel{background:#fff;padding:16px;overflow:auto;box-shadow:3px 0 14px #0002;z-index:20}.panel h1{font-size:22px;margin:0 0 3px}.hint{font-size:11px;color:#68788c;margin-bottom:10px}.sec{border-top:1px solid #e2e8ef;padding-top:10px;margin-top:12px}.sec h3{font-size:14px;color:#0067b8;margin:0 0 8px}.field{margin-bottom:8px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}.field input,.field textarea,.field select{width:100%;padding:7px;border:1px solid #cbd5df;border-radius:6px}.field textarea{height:50px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.toolbar button,.btn{border:0;border-radius:6px;padding:8px 10px;background:#0067b8;color:#fff;font-weight:700;cursor:pointer}.toolbar .secondary,.secondary{background:#e8eef5;color:#17324d}.danger{background:#b42318!important}.slideList,.elementList{display:grid;gap:5px}.slideRow{display:grid;grid-template-columns:1fr auto auto;gap:4px}.slideRow button{padding:7px;border:0;border-radius:5px;cursor:pointer}.slideRow .selected{background:#0067b8;color:#fff}.elementRow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:3px;align-items:center;border:1px solid #dde5ed;border-radius:6px;padding:5px;cursor:pointer}.elementRow.selected{border-color:#0067b8;background:#eef7ff}.layerBtn{border:0;background:#eef2f6;border-radius:4px;padding:5px;cursor:pointer}.workspace{display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.screen{position:relative;overflow:hidden;width:min(calc((100vh - 40px)*.5625),calc(100vw - 480px));aspect-ratio:9/16;max-height:calc(100vh - 40px);background:#071a33;box-shadow:0 16px 44px #16324d40}.slide{position:absolute;inset:0;display:none;background-size:cover;background-position:center}.slide.active{display:block}.gridOn{background-image:linear-gradient(#ffffff15 1px,transparent 1px),linear-gradient(90deg,#ffffff15 1px,transparent 1px);background-size:54px 54px}.guideV,.guideH{position:absolute;background:#28a5ff;z-index:99;pointer-events:none;display:none}.guideV{width:1px;top:0;bottom:0;left:50%}.guideH{height:1px;left:0;right:0;top:50%}.el{position:absolute;left:50%;top:50%;transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px)));z-index:var(--z,3);cursor:move;touch-action:none}.textEl{width:var(--tw,86%);text-align:var(--align,center);color:var(--color,#fff);font-family:var(--font,Arial);font-size:var(--fs,40px);font-weight:var(--weight,400);font-style:var(--style,normal);text-decoration:var(--deco,none);white-space:pre-wrap;line-height:var(--lh,1.25);letter-spacing:var(--ls,0px)}.imageEl,.videoEl{width:var(--w,45%);max-height:70%;object-fit:contain}.audioEl{width:var(--w,70%)}.selectedEl{outline:2px dashed #55b9ff;outline-offset:5px}.resizeHandle{position:absolute;width:18px;height:18px;background:#fff;border:2px solid #0067b8;border-radius:50%;z-index:100;display:none;cursor:nwse-resize;touch-action:none}.progress{position:absolute;z-index:120;left:0;bottom:0;height:5px;background:#55b9ff}.counter{position:absolute;z-index:121;right:4%;bottom:2%;font-size:13px;color:#fff;opacity:.7}.screen:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;box-shadow:none}@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}.panel{height:auto}.screen{width:min(92vw,540px);max-height:none}.workspace{min-height:100vh}}
</style></head><body><div class="app"><aside class="panel"><h1>Digital Board Studio 2.0</h1><div class="hint">1080×1920 • Undo/Redo • Resize • Snap • Layers • Text Formatting • Templates • Save/Load</div>
<div class="sec"><h3>โปรเจกต์</h3><div class="toolbar"><button id="saveProject">💾 Save</button><button id="loadProject" class="secondary">📂 Load</button><button id="undo" class="secondary">↶ Undo</button><button id="redo" class="secondary">↷ Redo</button></div><input id="projectFile" type="file" accept="application/json,.json" hidden><div id="saveStatus" class="hint" style="margin-top:6px"></div></div>
<div class="sec"><h3>Template</h3><div class="toolbar"><button data-template="welcome">👋 Visitor Welcome</button><button data-template="announce" class="secondary">📢 Announcement</button><button data-template="safety" class="secondary">⚠ Safety</button></div></div>
<div class="sec"><h3>สไลด์</h3><div id="slideList" class="slideList"></div><div class="toolbar" style="margin-top:6px"><button id="addSlide">+ เพิ่ม</button><button id="dupSlide" class="secondary">ทำสำเนา</button><button id="delSlide" class="danger">ลบ</button></div></div>
<div class="sec"><h3>พื้นหลัง</h3><div class="row"><div class="field"><label>สี</label><input id="bgColor" type="color"></div><div class="field"><label>เวลา (วินาที)</label><input id="duration" type="number" min="1"></div></div><div class="field"><label>ภาพพื้นหลัง</label><input id="bgImage" type="file" accept="image/*"></div><div class="toolbar"><button id="clearBg" class="secondary">ล้างภาพ</button><button id="toggleGrid" class="secondary"># Grid</button><button id="toggleSnap" class="secondary">🧲 Snap: ON</button></div></div>
<div class="sec"><h3>เพิ่มองค์ประกอบ</h3><div class="toolbar"><button data-add="text">+ Text</button><button data-add="image">+ Image</button><button data-add="video">+ Video</button><button data-add="audio">+ Audio</button></div></div>
<div class="sec"><h3>Layers</h3><div id="elementList" class="elementList"></div></div>
<div class="sec"><h3>แก้ไของค์ประกอบ</h3><div id="noSelection" class="hint">เลือกองค์ประกอบบนจอหรือ Layers</div><div id="editFields" style="display:none"><div id="textControls"><div class="field"><label>ข้อความ</label><textarea id="textValue"></textarea></div><div class="row"><div class="field"><label>Font</label><select id="fontFamily"><option>Arial</option><option>Tahoma</option><option>Verdana</option><option>Georgia</option><option>Courier New</option></select></div><div class="field"><label>Size</label><input id="fontSize" type="number" min="8"></div></div><div class="toolbar" style="margin-bottom:6px"><button id="bold" class="secondary">B</button><button id="italic" class="secondary">I</button><button id="underline" class="secondary">U</button><button data-align="left" class="secondary">⬅</button><button data-align="center" class="secondary">☰</button><button data-align="right" class="secondary">➡</button></div><div class="row"><div class="field"><label>สีตัวอักษร</label><input id="textColor" type="color"></div><div class="field"><label>ความกว้าง Text (%)</label><input id="textWidth" type="number" min="10" max="100"></div></div><div class="row"><div class="field"><label>Line spacing</label><input id="lineHeight" type="number" step="0.05" min="0.7"></div><div class="field"><label>Letter spacing</label><input id="letterSpacing" type="number" step="1"></div></div></div><div class="row"><div class="field"><label>X</label><input id="posX" type="number"></div><div class="field"><label>Y</label><input id="posY" type="number"></div></div><div class="field" id="widthBox"><label>ขนาดสื่อ (%)</label><input id="mediaWidth" type="number" min="5" max="100"></div><div class="toolbar"><button id="centerH" class="secondary">↔ Center</button><button id="centerV" class="secondary">↕ Center</button><button id="removeElement" class="danger">ลบ</button></div></div></div>
<div class="sec"><div class="toolbar"><button id="fullscreen">▶ Full Screen</button><button id="playFirst" class="secondary">เริ่ม Slide 1</button></div></div></aside>
<main class="workspace"><div id="screen" class="screen"><div id="guideV" class="guideV"></div><div id="guideH" class="guideH"></div><div id="handle" class="resizeHandle"></div><div id="progress" class="progress"></div><div id="counter" class="counter"></div></div></main></div>
<script>
const $=id=>document.getElementById(id),screen=$('screen'),KEY='digitalBoardStudioV2';let slides=[],activeSlide=0,selectedId=null,timer=null,drag=null,resize=null,idSeq=1,snap=true,grid=false,history=[],future=[],restoring=false;
const fresh=()=>({id:idSeq++,bg:'#0067b8',bgImage:'',duration:10,elements:[]});const uid=()=>`e${idSeq++}`;const cur=()=>slides[activeSlide];const sel=()=>cur()?.elements.find(e=>e.id===selectedId);
function txt(text,x=0,y=0,fs=54,color='#fff'){return{id:uid(),type:'text',text,x,y,fs,color,font:'Arial',weight:400,style:'normal',deco:'none',align:'center',tw:86,lh:1.25,ls:0,z:3,hidden:false,locked:false}}
function state(){return JSON.stringify({slides,activeSlide})}function pushHistory(){if(restoring)return;history.push(state());if(history.length>50)history.shift();future=[]}function restoreState(raw){restoring=true;const p=JSON.parse(raw);slides=p.slides;activeSlide=Math.min(p.activeSlide||0,slides.length-1);selectedId=null;recompute();render(false);restoring=false;autosave()}function undo(){if(!history.length)return;future.push(state());restoreState(history.pop())}function redo(){if(!future.length)return;history.push(state());restoreState(future.pop())}$('undo').onclick=undo;$('redo').onclick=redo;
function project(){return{version:2,canvas:{width:1080,height:1920},slides,activeSlide,savedAt:new Date().toISOString()}}function recompute(){let m=0;slides.forEach(s=>{m=Math.max(m,+s.id||0);(s.elements||[]).forEach(e=>m=Math.max(m,+String(e.id).replace(/\D/g,'')||0))});idSeq=m+1}function autosave(){try{localStorage.setItem(KEY,JSON.stringify(project()));$('saveStatus').textContent='Auto Save แล้ว'}catch(e){$('saveStatus').textContent='Auto Save ไม่สำเร็จ'}}function loadLocal(){try{const p=JSON.parse(localStorage.getItem(KEY));if(!p?.slides?.length)return false;slides=p.slides;activeSlide=Math.min(p.activeSlide||0,slides.length-1);recompute();return true}catch(e){return false}}
$('saveProject').onclick=()=>{const b=new Blob([JSON.stringify(project(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='digital-board-v2-project.json';a.click();URL.revokeObjectURL(u);$('saveStatus').textContent='ดาวน์โหลด Project แล้ว'};$('loadProject').onclick=()=>$('projectFile').click();$('projectFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p?.slides?.length)throw 0;pushHistory();slides=p.slides;activeSlide=Math.min(p.activeSlide||0,slides.length-1);recompute();selectedId=null;render();$('saveStatus').textContent='โหลด Project แล้ว'}catch(x){alert('ไฟล์โปรเจกต์ไม่ถูกต้อง')}};r.readAsText(f);e.target.value=''};
function template(name){pushHistory();const s=fresh();if(name==='welcome'){s.bg='#062b55';s.elements=[txt('WELCOME',0,-500,38,'#9ed7ff'),txt('Welcome to Our Company',0,-140,78),txt('VISITOR COMPANY',0,40,46,'#70c8ff'),txt('7 October 2026',0,300,32)]}else if(name==='safety'){s.bg='#0b2947';s.elements=[txt('SAFETY FIRST',0,-420,40,'#ffd95a'),txt('Safety Announcement',0,-70,72),txt('ขอบคุณที่ร่วมกันสร้างพื้นที่ทำงานที่ปลอดภัย',0,170,38)]}else{s.bg='#f2f7fc';s.elements=[txt('ANNOUNCEMENT',0,-400,38,'#0067b8'),txt('หัวข้อประกาศ',0,-60,75,'#152238'),txt('รายละเอียดประกาศ',0,160,38,'#334e68')]}slides.push(s);activeSlide=slides.length-1;selectedId=null;render()}document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>template(b.dataset.template));
function render(save=true){screen.querySelectorAll('.slide').forEach(n=>n.remove());slides.forEach((s,i)=>{const d=document.createElement('section');d.className='slide '+(i===activeSlide?'active ':'')+(grid?'gridOn':'');d.style.backgroundColor=s.bg||'#0067b8';d.style.backgroundImage=s.bgImage?`url(${s.bgImage})`:'';(s.elements||[]).forEach(e=>{if(!e.hidden)d.appendChild(draw(e))});screen.insertBefore(d,$('guideV'))});$('counter').textContent=`${activeSlide+1} / ${slides.length}`;slidesUI();layersUI();slideFields();editor();positionHandle();restart();if(save)autosave()}
function draw(e){let n;if(e.type==='text'){n=document.createElement('div');n.className='el textEl';n.textContent=e.text;n.style.setProperty('--fs',(e.fs||40)+'px');n.style.setProperty('--color',e.color||'#fff');n.style.setProperty('--font',e.font||'Arial');n.style.setProperty('--weight',e.weight||400);n.style.setProperty('--style',e.style||'normal');n.style.setProperty('--deco',e.deco||'none');n.style.setProperty('--align',e.align||'center');n.style.setProperty('--tw',(e.tw||86)+'%');n.style.setProperty('--lh',e.lh||1.25);n.style.setProperty('--ls',(e.ls||0)+'px')}else if(e.type==='image'){n=document.createElement('img');n.className='el imageEl';n.src=e.src}else if(e.type==='video'){n=document.createElement('video');n.className='el videoEl';n.src=e.src;n.controls=true;n.loop=true;n.muted=true;n.playsInline=true}else{n=document.createElement('audio');n.className='el audioEl';n.src=e.src;n.controls=true;n.loop=true}if(e.type!=='text')n.style.setProperty('--w',(e.w||45)+'%');n.style.setProperty('--x',(e.x||0)+'px');n.style.setProperty('--y',(e.y||0)+'px');n.style.setProperty('--z',e.z||3);n.id=e.id;if(e.id===selectedId)n.classList.add('selectedEl');n.onclick=ev=>{ev.stopPropagation();select(e.id)};if(!e.locked)n.onpointerdown=startDrag;return n}
function slidesUI(){$('slideList').innerHTML='';slides.forEach((s,i)=>{const r=document.createElement('div');r.className='slideRow';r.innerHTML=`<button class="${i===activeSlide?'selected':''}" data-si="${i}">Slide ${i+1}</button><button data-up="${i}">↑</button><button data-dn="${i}">↓</button>`;$('slideList').appendChild(r)});document.querySelectorAll('[data-si]').forEach(b=>b.onclick=()=>{activeSlide=+b.dataset.si;selectedId=null;render()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mvSlide(+b.dataset.up,-1));document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mvSlide(+b.dataset.dn,1))}
function mvSlide(i,n){let j=i+n;if(j<0||j>=slides.length)return;pushHistory();[slides[i],slides[j]]=[slides[j],slides[i]];activeSlide=j;render()}
function layersUI(){$('elementList').innerHTML='';[...(cur().elements||[])].sort((a,b)=>(b.z||3)-(a.z||3)).forEach(e=>{const r=document.createElement('div');r.className='elementRow'+(e.id===selectedId?' selected':'');r.innerHTML=`<span>${e.type==='text'?(e.text||'Text').slice(0,18):e.type}</span><button class="layerBtn" data-eye="${e.id}">${e.hidden?'○':'◉'}</button><button class="layerBtn" data-lock="${e.id}">${e.locked?'🔒':'🔓'}</button><button class="layerBtn" data-fwd="${e.id}">↑</button><button class="layerBtn" data-back="${e.id}">↓</button>`;r.querySelector('span').onclick=()=>select(e.id);$('elementList').appendChild(r)});document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>changeLayer(b.dataset.eye,'hidden'));document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>changeLayer(b.dataset.lock,'locked'));document.querySelectorAll('[data-fwd]').forEach(b=>b.onclick=()=>zChange(b.dataset.fwd,1));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>zChange(b.dataset.back,-1))}
function findE(id){return cur().elements.find(e=>e.id===id)}function changeLayer(id,p){pushHistory();const e=findE(id);e[p]=!e[p];render()}function zChange(id,n){pushHistory();const e=findE(id);e.z=Math.max(1,(e.z||3)+n);render()}
function select(id){selectedId=id;layersUI();editor();screen.querySelectorAll('.el').forEach(n=>n.classList.toggle('selectedEl',n.id===id));positionHandle()}
function slideFields(){const s=cur();$('bgColor').value=s.bg||'#0067b8';$('duration').value=s.duration||10}
function editor(){const e=sel(),ok=!!e;$('noSelection').style.display=ok?'none':'block';$('editFields').style.display=ok?'block':'none';$('handle').style.display=ok&&e.type!=='audio'&&!e.locked?'block':'none';if(!ok)return;const t=e.type==='text';$('textControls').style.display=t?'block':'none';$('widthBox').style.display=t?'none':'block';if(t){$('textValue').value=e.text||'';$('fontSize').value=e.fs||40;$('textColor').value=e.color||'#fff';$('fontFamily').value=e.font||'Arial';$('textWidth').value=e.tw||86;$('lineHeight').value=e.lh||1.25;$('letterSpacing').value=e.ls||0}$('posX').value=e.x||0;$('posY').value=e.y||0;if(!t)$('mediaWidth').value=e.w||45}
function positionHandle(){const e=sel(),h=$('handle');if(!e||e.type==='audio'||e.locked){h.style.display='none';return}const n=$(e.id);if(!n)return;const sr=screen.getBoundingClientRect(),r=n.getBoundingClientRect();h.style.display='block';h.style.left=(r.right-sr.left-9)+'px';h.style.top=(r.bottom-sr.top-9)+'px'}
function mutate(fn){pushHistory();fn();render()}
function fileData(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}function addMedia(type){const i=document.createElement('input');i.type='file';i.accept=type+'/*';i.onchange=()=>{const f=i.files[0];if(f)fileData(f,src=>mutate(()=>{const e={id:uid(),type,src,x:0,y:0,w:type==='audio'?70:50,z:3,hidden:false,locked:false};cur().elements.push(e);selectedId=e.id}))};i.click()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(b.dataset.add==='text')mutate(()=>{const e=txt();cur().elements.push(e);selectedId=e.id});else addMedia(b.dataset.add)});$('addSlide').onclick=()=>mutate(()=>{slides.push(fresh());activeSlide=slides.length-1;selectedId=null});$('delSlide').onclick=()=>{if(slides.length>1)mutate(()=>{slides.splice(activeSlide,1);activeSlide=Math.max(0,activeSlide-1);selectedId=null})};$('dupSlide').onclick=()=>mutate(()=>{const c=JSON.parse(JSON.stringify(cur()));c.id=idSeq++;c.elements.forEach(e=>e.id=uid());slides.splice(activeSlide+1,0,c);activeSlide++;selectedId=null});
$('bgColor').onchange=e=>mutate(()=>cur().bg=e.target.value);$('duration').onchange=e=>mutate(()=>cur().duration=Math.max(1,+e.target.value||1));$('bgImage').onchange=e=>{const f=e.target.files[0];if(f)fileData(f,v=>mutate(()=>cur().bgImage=v))};$('clearBg').onclick=()=>mutate(()=>cur().bgImage='');$('toggleGrid').onclick=()=>{grid=!grid;render(false)};$('toggleSnap').onclick=()=>{snap=!snap;$('toggleSnap').textContent=`🧲 Snap: ${snap?'ON':'OFF'}`};
function setProp(p,v){const e=sel();if(e)mutate(()=>e[p]=v)}$('textValue').onchange=e=>setProp('text',e.target.value);$('fontSize').onchange=e=>setProp('fs',Math.max(8,+e.target.value||8));$('textColor').onchange=e=>setProp('color',e.target.value);$('fontFamily').onchange=e=>setProp('font',e.target.value);$('textWidth').onchange=e=>setProp('tw',Math.min(100,Math.max(10,+e.target.value||86)));$('lineHeight').onchange=e=>setProp('lh',+e.target.value||1.25);$('letterSpacing').onchange=e=>setProp('ls',+e.target.value||0);$('posX').onchange=e=>setProp('x',+e.target.value||0);$('posY').onchange=e=>setProp('y',+e.target.value||0);$('mediaWidth').onchange=e=>setProp('w',Math.min(100,Math.max(5,+e.target.value||45)));$('bold').onclick=()=>{const e=sel();if(e)setProp('weight',e.weight===700?400:700)};$('italic').onclick=()=>{const e=sel();if(e)setProp('style',e.style==='italic'?'normal':'italic')};$('underline').onclick=()=>{const e=sel();if(e)setProp('deco',e.deco==='underline'?'none':'underline')};document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>setProp('align',b.dataset.align));$('centerH').onclick=()=>setProp('x',0);$('centerV').onclick=()=>setProp('y',0);$('removeElement').onclick=()=>mutate(()=>{cur().elements=cur().elements.filter(e=>e.id!==selectedId);selectedId=null});
function startDrag(ev){const e=findE(ev.currentTarget.id);if(!e||e.locked)return;pushHistory();selectedId=e.id;ev.preventDefault();const r=screen.getBoundingClientRect();drag={e,sx:ev.clientX,sy:ev.clientY,bx:e.x||0,by:e.y||0,kx:1080/r.width,ky:1920/r.height};select(e.id)}document.addEventListener('pointermove',ev=>{if(!drag)return;let x=Math.round(drag.bx+(ev.clientX-drag.sx)*drag.kx),y=Math.round(drag.by+(ev.clientY-drag.sy)*drag.ky);$('guideV').style.display='none';$('guideH').style.display='none';if(snap){if(Math.abs(x)<25){x=0;$('guideV').style.display='block'}if(Math.abs(y)<25){y=0;$('guideH').style.display='block'}x=Math.round(x/10)*10;y=Math.round(y/10)*10}drag.e.x=x;drag.e.y=y;const n=$(drag.e.id);n.style.setProperty('--x',x+'px');n.style.setProperty('--y',y+'px');$('posX').value=x;$('posY').value=y;positionHandle()});document.addEventListener('pointerup',()=>{if(drag){drag=null;$('guideV').style.display='none';$('guideH').style.display='none';autosave()}});
$('handle').onpointerdown=ev=>{const e=sel();if(!e)return;ev.preventDefault();ev.stopPropagation();pushHistory();resize={e,startX:ev.clientX,base:e.type==='text'?(e.fs||40):(e.w||45)}};document.addEventListener('pointermove',ev=>{if(!resize)return;const delta=(ev.clientX-resize.startX);if(resize.e.type==='text')resize.e.fs=Math.max(8,Math.round(resize.base+delta*.6));else resize.e.w=Math.min(100,Math.max(5,resize.base+delta*.12));const n=$(resize.e.id);if(resize.e.type==='text')n.style.setProperty('--fs',resize.e.fs+'px');else n.style.setProperty('--w',resize.e.w+'%');editor();positionHandle()});document.addEventListener('pointerup',()=>{if(resize){resize=null;autosave()}});
// Publish: ส่ง snapshot ล่าสุดไปยัง Player ที่เปิดจาก origin เดียวกัน
let publishChannel=null;
try{publishChannel=new BroadcastChannel('digital-board-studio-v2')}catch(e){}
function publishedData(){return{version:2,canvas:{width:1080,height:1920},slides:JSON.parse(JSON.stringify(slides)),publishedAt:new Date().toISOString()}}
function publishNow(){
 try{
  const data=publishedData();
  localStorage.setItem(PUBLISH_KEY,JSON.stringify(data));
